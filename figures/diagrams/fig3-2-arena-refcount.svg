<?xml version="1.0" encoding="UTF-8"?>
<!--
  Figure 3.2  Arena slot reference-counting protocol.

  The claim this diagram exists to carry is that the reader's own reference is what makes the
  reset-under-dispatch race impossible. The slot cannot return to FREE while any dispatch is
  outstanding, because the reader's reference is released only after every worker reference has
  been taken, and the count reaches zero only when all of them have been dropped. That is a
  structural argument, not a timing one: no bound on how long a worker takes is required.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a6360a"/>
    </marker>
    <style>
      .st  { fill:#eef2f9; stroke:#1f3b73; stroke-width:1.6; }
      .stf { fill:#f2f2f2; stroke:#555;    stroke-width:1.6; }
      .bad { fill:#fdecec; stroke:#a6360a; stroke-width:1.6; stroke-dasharray:5 3; }
      .tb  { font-size:13px; fill:#111; font-weight:bold; }
      .t   { font-size:11.5px; fill:#111; }
      .s   { font-size:10px;   fill:#444; }
      .sr  { font-size:10px;   fill:#a6360a; }
      .ln  { stroke:#333; stroke-width:1.5; fill:none; marker-end:url(#a); }
      .lnx { stroke:#a6360a; stroke-width:1.5; fill:none; marker-end:url(#ax); }
      .el  { font-size:10.5px; fill:#1f3b73; }
    </style>
  </defs>

  <text x="12" y="22" class="tb" font-size="14">Figure 3.2  Arena slot lifetime: the reader's own reference removes the reset race</text>

  <!-- FREE -->
  <rect x="26" y="72" width="150" height="66" rx="8" class="stf"/>
  <text x="101" y="100" class="tb" text-anchor="middle">FREE</text>
  <text x="101" y="118" class="s" text-anchor="middle">on the free list</text>
  <text x="101" y="131" class="s" text-anchor="middle">refcount = 0</text>

  <!-- ACQUIRED -->
  <rect x="252" y="72" width="186" height="66" rx="8" class="st"/>
  <text x="345" y="100" class="tb" text-anchor="middle">ACQUIRED</text>
  <text x="345" y="118" class="s" text-anchor="middle">reader owns the only reference</text>
  <text x="345" y="131" class="s" text-anchor="middle">refcount = 1</text>

  <!-- DISPATCHED -->
  <rect x="514" y="72" width="212" height="66" rx="8" class="st"/>
  <text x="620" y="100" class="tb" text-anchor="middle">DISPATCHED</text>
  <text x="620" y="118" class="s" text-anchor="middle">reader + n workers hold references</text>
  <text x="620" y="131" class="s" text-anchor="middle">refcount = 1 + n</text>

  <!-- DRAINING -->
  <rect x="514" y="222" width="212" height="66" rx="8" class="st"/>
  <text x="620" y="250" class="tb" text-anchor="middle">DRAINING</text>
  <text x="620" y="268" class="s" text-anchor="middle">reader has let go; workers have not</text>
  <text x="620" y="281" class="s" text-anchor="middle">refcount = n &gt; 0</text>

  <!-- arrows -->
  <path d="M176,105 L248,105" class="ln"/>
  <text x="212" y="96" class="el" text-anchor="middle">acquire()</text>
  <text x="212" y="124" class="s" text-anchor="middle">+1</text>

  <path d="M438,105 L510,105" class="ln"/>
  <text x="474" y="96" class="el" text-anchor="middle">push to rings</text>
  <text x="474" y="124" class="s" text-anchor="middle">+n</text>

  <path d="M620,138 L620,218" class="ln"/>
  <text x="630" y="166" class="el">reader release()</text>
  <text x="630" y="180" class="s">&#8722;1, after every</text>
  <text x="630" y="193" class="s">worker reference exists</text>

  <path d="M514,262 C380,262 240,230 150,146" class="ln"/>
  <text x="330" y="312" class="el" text-anchor="middle">last worker release() &#8594; refcount 0 &#8594; slot returns to the free list</text>
  <text x="330" y="328" class="s" text-anchor="middle">reset happens here, and only here</text>

  <!-- the race that cannot happen -->
  <rect x="26" y="356" width="904" height="96" rx="8" class="bad"/>
  <text x="40" y="378" class="tb" fill="#a6360a">The race this ordering excludes</text>
  <text x="40" y="398" class="sr">If acquire() returned a slot at refcount 0, or if the reader released before the workers' references existed, the count could</text>
  <text x="40" y="414" class="sr">reach zero while a ChunkRef was still in a ring. The slot would be reset and reused, and the descriptor would then point into</text>
  <text x="40" y="430" class="sr">another read's payload &#8212; silent corruption rather than a crash, because the memory is still mapped and still arena-owned.</text>
  <text x="40" y="446" class="sr">The reader holding the initial reference makes this unrepresentable, with no assumption about how long a worker takes.</text>
</svg>
