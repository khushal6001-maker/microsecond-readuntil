<?xml version="1.0" encoding="UTF-8"?>
<!--
  Figure 3.1  Data-plane block diagram.

  Hand-written rather than generated, because it encodes structure rather than data. The one
  claim it has to carry correctly is where the copy boundary sits: the protobuf runtime
  performs exactly one copy, into arena-backed storage, and nothing downstream of that copies
  signal again. Everything after the admission box moves 56-byte borrowed descriptors.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a6360a"/>
    </marker>
    <style>
      .box  { fill:#eef2f9; stroke:#1f3b73; stroke-width:1.5; }
      .ring { fill:#fff4ec; stroke:#a6360a; stroke-width:1.5; }
      .ext  { fill:#f2f2f2; stroke:#555;    stroke-width:1.5; }
      .t    { font-size:12px; fill:#111; }
      .tb   { font-size:12px; fill:#111; font-weight:bold; }
      .s    { font-size:10px; fill:#444; }
      .sr   { font-size:10px; fill:#a6360a; }
      .lbl  { font-size:10.5px; fill:#1f3b73; font-style:italic; }
      .ln   { stroke:#333; stroke-width:1.4; fill:none; marker-end:url(#a); }
      .lnr  { stroke:#a6360a; stroke-width:1.4; fill:none; marker-end:url(#ar); }
      .cut  { stroke:#a6360a; stroke-width:1.6; stroke-dasharray:6 4; fill:none; }
    </style>
  </defs>

  <text x="12" y="22" class="tb" font-size="14">Figure 3.1  Data plane: one copy at admission, borrowed views thereafter</text>

  <!-- instrument -->
  <rect x="14" y="52" width="118" height="74" rx="5" class="ext"/>
  <text x="73" y="80" class="t" text-anchor="middle">MinKNOW</text>
  <text x="73" y="96" class="s" text-anchor="middle">get_live_reads</text>
  <text x="73" y="110" class="s" text-anchor="middle">TLS / gRPC</text>

  <!-- reader -->
  <rect x="168" y="42" width="178" height="94" rx="5" class="box"/>
  <text x="257" y="64" class="tb" text-anchor="middle">reader thread</text>
  <text x="257" y="82" class="s" text-anchor="middle">stream-&gt;Read() into arena</text>
  <text x="257" y="97" class="s" text-anchor="middle">slot.acquire() &#8594; refcount 1</text>
  <text x="257" y="112" class="s" text-anchor="middle">stamp t_recv_tsc</text>
  <text x="257" y="127" class="s" text-anchor="middle">shard = channel &amp; mask</text>

  <!-- copy boundary -->
  <path d="M356,30 L356,330" class="cut"/>
  <text x="362" y="44" class="sr">copy boundary</text>
  <text x="362" y="57" class="sr">one copy, by the protobuf</text>
  <text x="362" y="70" class="sr">runtime, into arena storage</text>
  <text x="362" y="83" class="sr">no signal is copied to the right of this line</text>

  <!-- rings -->
  <g>
    <rect x="392" y="104" width="150" height="40" rx="5" class="ring"/>
    <text x="467" y="121" class="t" text-anchor="middle">SPSC ring, shard 0</text>
    <text x="467" y="136" class="s" text-anchor="middle">ChunkRef, 56 B</text>

    <rect x="392" y="152" width="150" height="40" rx="5" class="ring"/>
    <text x="467" y="169" class="t" text-anchor="middle">SPSC ring, shard 1</text>
    <text x="467" y="184" class="s" text-anchor="middle">ChunkRef, 56 B</text>
  </g>
  <text x="467" y="210" class="s" text-anchor="middle">one ring per shard; lock-free,</text>
  <text x="467" y="223" class="s" text-anchor="middle">cached head/tail, drop-never-block</text>

  <!-- workers -->
  <rect x="588" y="92" width="186" height="60" rx="5" class="box"/>
  <text x="681" y="112" class="tb" text-anchor="middle">worker 0</text>
  <text x="681" y="128" class="s" text-anchor="middle">per-channel state, probe, decide</text>
  <text x="681" y="143" class="s" text-anchor="middle">no allocation, no lock</text>

  <rect x="588" y="162" width="186" height="60" rx="5" class="box"/>
  <text x="681" y="182" class="tb" text-anchor="middle">worker 1</text>
  <text x="681" y="198" class="s" text-anchor="middle">per-channel state, probe, decide</text>
  <text x="681" y="213" class="s" text-anchor="middle">no allocation, no lock</text>

  <text x="681" y="243" class="lbl" text-anchor="middle">sharding by channel makes all per-channel</text>
  <text x="681" y="257" class="lbl" text-anchor="middle">state single-threaded by construction</text>

  <!-- action ring + writer -->
  <rect x="820" y="104" width="146" height="40" rx="5" class="ring"/>
  <text x="893" y="121" class="t" text-anchor="middle">action ring</text>
  <text x="893" y="136" class="s" text-anchor="middle">eject / stop_further</text>

  <rect x="820" y="172" width="146" height="62" rx="5" class="box"/>
  <text x="893" y="193" class="tb" text-anchor="middle">writer thread</text>
  <text x="893" y="210" class="s" text-anchor="middle">batches Actions,</text>
  <text x="893" y="224" class="s" text-anchor="middle">same stream</text>

  <!-- index -->
  <rect x="588" y="286" width="186" height="52" rx="5" class="ext"/>
  <text x="681" y="306" class="t" text-anchor="middle">minimizer index</text>
  <text x="681" y="322" class="s" text-anchor="middle">read-only, shared, built once</text>

  <!-- arrows -->
  <path d="M132,89 L164,89" class="ln"/>
  <path d="M346,100 C368,100 372,120 388,122" class="ln"/>
  <path d="M346,112 C368,118 372,165 388,170" class="ln"/>
  <path d="M542,122 L584,122" class="ln"/>
  <path d="M542,172 L584,192" class="ln"/>
  <path d="M774,118 L816,120" class="ln"/>
  <path d="M774,186 C796,186 800,150 816,140" class="ln"/>
  <path d="M893,144 L893,168" class="ln"/>
  <path d="M681,286 L681,226" class="ln"/>
  <path d="M681,286 L681,156" class="ln"/>

  <!-- action return path -->
  <path d="M893,234 C893,300 700,352 420,352 C240,352 110,300 76,130" class="lnr"/>
  <text x="520" y="368" class="sr" text-anchor="middle">actions returned on the same bidirectional stream</text>

  <!-- release path -->
  <path d="M588,140 C560,140 560,268 300,268 C260,268 236,200 240,142" class="ln"
        stroke-dasharray="4 3"/>
  <text x="300" y="284" class="s" text-anchor="middle">slot.release() when the last holder is done (Figure 3.2)</text>

  <!-- budget note -->
  <rect x="14" y="392" width="952" height="62" rx="5" fill="#fbfbfb" stroke="#ccc"/>
  <text x="26" y="412" class="s">Deadline: a chunk describes signal that has already translocated. With a tolerance of W chunks, C channels and a chunk cadence of T&#8338;,</text>
  <text x="26" y="428" class="s">the admissible mean service time is S &lt; W&#183;T&#8338;/C, which at W = 2, C = 512 and T&#8338; = 0.4 s is 1.56 ms per decision (&#167;3.1.3).</text>
  <text x="26" y="444" class="s">Backpressure is drop-never-block, so the invariant the counters maintain is offered = pushed + dropped (&#167;3.5).</text>
</svg>
